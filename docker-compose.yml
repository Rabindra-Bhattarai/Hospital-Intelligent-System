services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./PatientSystem
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/
    volumes:
      - ./Raw_data_outputs:/Raw_data_outputs:ro
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8502:8501"

volumes:
  mongo_data:
