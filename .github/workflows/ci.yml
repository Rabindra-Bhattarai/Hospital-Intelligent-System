name: CI

on:
  push:
    branches: [main, phase4]
    paths: ["PatientSystem/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["PatientSystem/**", ".github/workflows/ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/
      ADMIN_USERNAME: ci_test_admin
      ADMIN_PASSWORD: CiTest!Pass123

    defaults:
      run:
        working-directory: PatientSystem

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: PatientSystem/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q app.py config.py src

      - name: Smoke tests (AppTest)
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./PatientSystem
          push: false
